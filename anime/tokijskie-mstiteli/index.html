<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Токийские мстители - Movie C2H5OH</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    
<div class="overlay">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
        <!-- Социалки над названием -->
        <div class="social-icons">
            <a href="https://t.me/samogon_goni" target="_blank" class="social-link">
                <span class="social-emoji">📱</span>
                Telegram
            </a>
            <a href="https://discord.gg/xZW75EtY" target="_blank" class="social-link">
                <span class="social-emoji">🎮</span>
                Discord
            </a>
        </div>

        <h1>ТОКИЙСКИЕ МСТИТЕЛИ</h1>

        <!-- Кнопки (части/сезоны) -->
        <div class="seasons">
            <div class="season-btn active" data-part="1">Токийские мстители (2021)</div>
            <div class="season-btn" data-part="2">Тиби-мститель (2021)</div>
            <div class="season-btn" data-part="3">Токийские мстители: Рождественская битва (2023)</div>
            <div class="season-btn" data-part="4">Токийские мстители: Поднебесье (2023)</div>
        </div>

        <!-- Контейнер для серий -->
        <div class="episodes-container" id="episodes">
            <!-- Общая кнопка "Смотреть" над списком -->
            <a href="#" target="_blank" class="watch-btn" id="common-watch-btn">Смотреть весь сезон</a>
            <ul class="episodes-list" id="episodes-list"></ul>
        </div>

        <a href="../" class="back-btn">← Назад к аниме</a>

        <footer>© 2026 Movie C2H5OH</footer>
    </div>

    <script>
        // Данные аниме (все серии НЕ ПРОСМОТРЕНЫ)
        const animeData = {
            1: Array.from({length: 24}, (_, i) => ({ num: i + 1, status: 'not-watched', link: 'https://site.yummyani.me/catalog/item/tokijskie-mstiteli' })),
            2: Array.from({length: 24}, (_, i) => ({ num: i + 1, status: 'not-watched', link: 'https://site.yummyani.me/catalog/item/tibi-mstitel' })),
            3: Array.from({length: 13}, (_, i) => ({ num: i + 1, status: 'not-watched', link: 'https://site.yummyani.me/catalog/item/tokiyskie-mstiteli-2' })),
            4: Array.from({length: 13}, (_, i) => ({ num: i + 1, status: 'not-watched', link: 'https://site.yummyani.me/catalog/item/tokiyskie-mstiteli-3' }))
        };

        // Тексты статусов
        const statusTexts = {
            'not-watched': 'Не просмотрено',
            'watching': 'Смотрю',
            'watched': 'Просмотрено'
        };

        // Ссылки на просмотр (общие для каждого "сезона")
        const watchLinks = {
            1: 'https://site.yummyani.me/catalog/item/tokijskie-mstiteli',
            2: 'https://site.yummyani.me/catalog/item/tibi-mstitel',
            3: 'https://site.yummyani.me/catalog/item/tokiyskie-mstiteli-2',
            4: 'https://site.yummyani.me/catalog/item/tokiyskie-mstiteli-3'
        };

        const animeButtons = document.querySelectorAll('.season-btn');
        const episodesContainer = document.getElementById('episodes');
        const episodesList = document.getElementById('episodes-list');
        const commonWatchBtn = document.getElementById('common-watch-btn');

        // Показываем первое аниме по умолчанию
        showAnime(1);

        animeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const anime = btn.getAttribute('data-part');
                showAnime(anime);

                animeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        function showAnime(anime) {
            episodesList.innerHTML = '';
            const episodes = animeData[anime] || [];

            // Общая кнопка "Смотреть" над списком
            commonWatchBtn.href = watchLinks[anime];
            commonWatchBtn.textContent = anime === '1' || anime === '3' || anime === '4' ? 'Смотреть весь сезон' : 'Смотреть все серии';

            if (episodes.length === 0) {
                episodesList.innerHTML = '<li style="text-align:center; padding:30px; font-size:1.3em;">Серии ещё не добавлены</li>';
            } else {
                episodes.forEach(ep => {
                    const li = document.createElement('li');
                    li.className = 'episode-item';

                    li.innerHTML = `
                        <a href="${ep.link}" target="_blank">
                            <span class="episode-number">Серия ${ep.num}</span>
                            <span class="episode-status ${ep.status}">
                                ${statusTexts[ep.status] || 'Не просмотрено'}
                            </span>
                        </a>
                    `;

                    episodesList.appendChild(li);
                });
            }

            episodesContainer.style.display = 'block';
        }
    </script>
</body>
</html>
